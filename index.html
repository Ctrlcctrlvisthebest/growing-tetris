<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A Tetris game where falling pieces keep growing." />
    <title>Growing Tetris</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
    <script src="sketch.js" defer></script>
  </head>
  <body>
    <main class="game-shell" aria-label="Growing Tetris game">
      <div class="canvas-stage">
        <div id="game-canvas"></div>
        <label class="growth-control" for="growth-speed">
          <span>Growth</span>
          <output id="growth-speed-value" for="growth-speed">3</output>
          <input id="growth-speed" type="range" min="1" max="10" value="3" step="1" />
          <small>Slow</small>
          <small>Fast</small>
        </label>
      </div>
      <div class="touch-controls" aria-label="Touch controls">
        <button data-action="rotate-ccw" aria-label="Rotate counterclockwise">↺</button>
        <button data-action="rotate" aria-label="Rotate clockwise">↻</button>
        <button data-action="rotate-180" aria-label="Rotate 180 degrees">180°</button>
        <button data-action="left" aria-label="Move left">←</button>
        <button data-action="right" aria-label="Move right">→</button>
        <button data-action="down" aria-label="Soft drop">↓</button>
        <button data-action="drop" aria-label="Hard drop">DROP</button>
        <button data-action="hold" aria-label="Hold or swap piece">HOLD</button>
        <button data-action="freeze" aria-label="Use growth freeze item">FREEZE ×0</button>
        <button data-action="mode" aria-label="Enter or exit hard mode">START HARD MODE</button>
      </div>
      <div class="desktop-controls" aria-label="Keyboard controls">
        <span><kbd>←</kbd><kbd>→</kbd> Move</span>
        <span><kbd>↓</kbd> Soft drop</span>
        <span><kbd>↑</kbd> Rotate CW</span>
        <span><kbd>Z</kbd> Rotate CCW</span>
        <span><kbd>X</kbd> Rotate 180°</span>
        <span><kbd>SPACE</kbd> Hard drop</span>
        <span><kbd>C</kbd> Hold / swap</span>
        <span><kbd>F</kbd> Freeze growth</span>
        <span><kbd>H</kbd> Hard mode</span>
        <span><kbd>R</kbd> Restart</span>
      </div>
    </main>
  </body>
</html>
